name: Refresh products from Begad
on:
  schedule:
    - cron: "15 */6 * * *"
    # 03:45 UTC = 07:45 UAE, after the office job writes the day's guide (07:00 UAE)
    - cron: "45 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: sync-catalog
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch Begad's product list and details
        run: node tools/build.mjs
      - name: Commit the snapshot and redeploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- catalog.js data/details.json data/articles.json; then
            echo "No change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.js data/details.json data/articles.json
          git commit -q -m "Refresh product snapshot from Begad"
          git push -q
          # A push made with the workflow token does not start other workflows,
          # so the deploy is started explicitly.
          gh workflow run aws.yml --ref main
